name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar
        run: pip install -e ".[dev]"
      - name: pdftotext (validar_extraccion.py, V23)
        run: sudo apt-get install -y poppler-utils
      - name: ruff
        run: ruff check app tests migrations
      - name: mypy (estricto en el dominio)
        run: mypy app
      - name: import-linter (capas y contextos)
        run: lint-imports
      - name: pytest (unitarias e integración sobre SQLite)
        run: pytest -q
      - name: Migración sin diferencias con los modelos
        run: |
          alembic -x url=sqlite:///ci.db upgrade head
          alembic -x url=sqlite:///ci.db check
  # Vitest se agrega en F4, cuando exista frontend/.
