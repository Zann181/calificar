name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar
        run: pip install -e ".[dev]"
      - name: ruff
        run: ruff check app tests migrations
      - name: mypy (estricto en el dominio)
        run: mypy app
      - name: import-linter (capas y contextos)
        run: lint-imports
      - name: pytest (unitarias e integración sobre SQLite)
        run: pytest -q
      - name: Migración sin diferencias con los modelos
        run: |
          alembic -x url=sqlite:///ci.db upgrade head
          alembic -x url=sqlite:///ci.db check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar
        run: npm ci
      - name: Vitest
        run: npm test
      - name: Tipos y compilación
        run: npm run build
