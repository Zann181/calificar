# Desarrollo local: solo infraestructura. API, despachador y servicio MinerU corren en el equipo
# (ver README.md). Sin Docker: ADR 0003. Uso: docker compose -f docker-compose.dev.yml up -d
name: extractor-matriz-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: extractor
      POSTGRES_PASSWORD: extractor
      POSTGRES_DB: extractor
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U extractor"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?defina S3_ACCESS_KEY en .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?defina S3_SECRET_KEY en .env}
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

volumes:
  pgdata:
  miniodata:
